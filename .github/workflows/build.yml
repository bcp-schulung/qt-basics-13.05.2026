name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt-host: windows
            qt-arch: win64_msvc2019_64
            artifact-name: weather-windows-x64
            artifact-path: build/Release/weather.exe
          - os: ubuntu-latest
            qt-host: linux
            qt-arch: ""
            artifact-name: weather-linux-x64
            artifact-path: build/weather
          - os: macos-latest
            qt-host: mac
            qt-arch: ""
            artifact-name: weather-macos-x64
            artifact-path: build/weather.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          host: ${{ matrix.qt-host }}
          target: "desktop"
          arch: ${{ matrix.qt-arch }}
          modules: "qtcharts"
          cache: true

      - name: Configure CMake
        run: cmake -S weather -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
