name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: "qtcharts"
          cache: true

      - name: Configure CMake
        run: cmake -S weather -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Bundle Qt dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build\Release\weather.exe dist\
          windeployqt --release --no-translations dist\weather.exe

      - name: Package as ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "dist\*" -DestinationPath "weather-$tag-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "weather-${{ github.ref_name }}-windows-x64.zip"
          generate_release_notes: true
          fail_on_unmatched_files: true
