name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt-host: windows
            qt-arch: win64_msvc2019_64
            package-name: weather-${{ github.ref_name }}-windows-x64.zip
          - os: ubuntu-latest
            qt-host: linux
            qt-arch: ""
            package-name: weather-${{ github.ref_name }}-linux-x64.zip
          - os: macos-latest
            qt-host: mac
            qt-arch: ""
            package-name: weather-${{ github.ref_name }}-macos-x64.zip

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          host: ${{ matrix.qt-host }}
          target: "desktop"
          arch: ${{ matrix.qt-arch }}
          modules: "qtcharts"
          cache: true

      - name: Configure CMake
        run: cmake -S weather -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest -C Release --output-on-failure

      # ── Windows ──────────────────────────────────────────────────────────
      - name: Bundle Qt dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build\Release\weather.exe dist\
          windeployqt --release --no-translations dist\weather.exe

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "dist\*" -DestinationPath "${{ matrix.package-name }}"

      # ── macOS ─────────────────────────────────────────────────────────────
      - name: Bundle Qt dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Remove SQL driver plugins that reference unavailable system libs
          # (ODBC, PostgreSQL, Mimer). The app only needs SQLite.
          find "$Qt6_DIR/plugins/sqldrivers" \
            \( -name "libqsqlodbc*" -o -name "libqsqlpsql*" -o -name "libqsqlmimer*" \) \
            -delete
          macdeployqt build/weather.app -dmg

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: zip -r "${{ matrix.package-name }}" build/weather.dmg

      # ── Linux ─────────────────────────────────────────────────────────────
      - name: Install linuxdeploy (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -qO linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -qO linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Bundle Qt dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          OUTPUT: weather-${{ github.ref_name }}-linux-x64.AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp build/weather AppDir/usr/bin/
          QMAKE=$Qt6_DIR/bin/qmake ./linuxdeploy --appdir AppDir --plugin qt --output appimage
          mv weather*.AppImage "$OUTPUT"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: zip "${{ matrix.package-name }}" weather-${{ github.ref_name }}-linux-x64.AppImage

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ matrix.package-name }}"
          generate_release_notes: ${{ matrix.os == 'windows-latest' }}
          fail_on_unmatched_files: true
